<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090d"><meta name="robots" content="noindex,nofollow"><title>ORACLE Investor</title><style>:root{--bg:#07090d;--panel:#0d1118;--line:#202836;--text:#f4f7fb;--muted:#8a99ad;--green:#67e39f;--amber:#ffd166;--blue:#7ca7ff;--red:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#111827 0,#07090d 34%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 70px}.ey{font-size:11px;letter-spacing:.2em;color:#6d7d94;font-weight:800}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin:8px 0 20px}.top h1{font-size:44px;line-height:.98;margin:6px 0 8px;letter-spacing:-.04em}.top p{margin:0;color:var(--muted)}.live{text-align:right;color:var(--green);font-size:11px}.status{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#10151e;border:1px solid #283346;padding:14px 16px;border-radius:14px;margin:18px 0}.status b{color:var(--amber)}.status span{color:var(--muted);font-size:12px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:26px}.kpi{background:rgba(13,17,24,.9);border:1px solid var(--line);border-radius:14px;padding:14px}.kpi small{display:block;color:#76859a;font-size:10px;margin-bottom:7px}.kpi b{font-size:21px}.neg{color:var(--red)}.layout{display:grid;grid-template-columns:1.55fr .78fr;gap:24px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.section-head h2,aside h2{font-size:16px}.section-head span{font-size:9px;color:#68778d;letter-spacing:.08em}.card{display:grid;grid-template-columns:38px 1fr 70px;gap:10px 12px;padding:17px 4px;border-top:1px solid var(--line);cursor:pointer}.card:hover{background:#0b1017}.rank{color:#536174;font-size:11px}.ctop{display:flex;gap:9px;align-items:center}.ctop b{font-size:24px;letter-spacing:-.03em}.card h3{font-size:13px;margin:3px 0;color:#b8c2d0;font-weight:500}.card p{font-size:12px;margin:0;color:#7f8fa4}.score{font-size:25px;color:var(--green);text-align:right;font-weight:800}.mini{grid-column:2/4;display:flex;gap:14px;font-size:9px;color:#69788d}.tag{display:inline-block;border-radius:999px;font-size:8px;font-weight:800;padding:4px 7px;letter-spacing:.05em}.INVESTIGATE{background:#103120;color:var(--green)}.WATCH{background:#35290c;color:var(--amber)}.DISCOVER{background:#102744;color:var(--blue)}.LOW{background:#202631;color:#9aa7b7}.par{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-top:1px solid var(--line);padding:14px 0}.par small,.par span{display:block;color:#748399;font-size:10px}.par span{grid-column:1/3}.par strong{color:var(--green)}.legend{margin-top:22px;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.legend p{font-size:11px;color:var(--muted)}.drawer{position:fixed;inset:0;display:none;background:rgba(2,5,9,.74);backdrop-filter:blur(8px);z-index:20}.drawer.open{display:block}.sheet{position:absolute;right:0;top:0;height:100%;width:min(560px,100%);background:#090d13;border-left:1px solid var(--line);padding:24px;overflow:auto}.close{float:right;border:0;background:#151b25;color:#cbd5e1;border-radius:10px;padding:8px 11px;font-size:16px}.sheet h2{font-size:34px;margin:16px 0 5px}.sheet .big{font-size:42px;color:var(--green);font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.box{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:15px}.box small{color:#718096}.box b{display:block;margin-top:6px}.note{font-size:12px;color:#8392a7;line-height:1.55}.error{padding:20px;border:1px solid #4a2630;background:#1b0f14;border-radius:14px;color:#ffb4b4}@media(max-width:820px){.wrap{padding:22px 14px 60px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:36px}.live{text-align:left}.status{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.card{grid-template-columns:30px 1fr 56px}.ctop b{font-size:21px}.grid2{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="ey">ORACLE · INVESTOR DECISION SYSTEM</div><div class="top"><div><h1>Où regarder maintenant ?</h1><p>Priorisation de recherche, paradigmes et validation historique en un seul écran.</p></div><div class="live" id="live">● CONNEXION…</div></div><div id="app"></div></main><div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"><div class="sheet"><button class="close" onclick="closeDrawer()">×</button><div id="detail"></div></div></div><script>const API='https://ayjqeuljbznanmscpzlv.supabase.co/functions/v1/oracle-investor-api';const f=(x,d=1)=>x==null?'—':Number(x).toLocaleString('fr-CH',{maximumFractionDigits:d});const pct=x=>x==null?'—':`${x>0?'+':''}${f(x,2)}%`;let DATA=null;async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error('API '+r.status);DATA=await r.json();render();document.getElementById('live').innerHTML='● LIVE<br><span style="color:#718096">'+new Date(DATA.generated_at).toLocaleString('fr-CH')+'</span>'}catch(e){document.getElementById('app').innerHTML='<div class="error">Impossible de charger les données ORACLE. '+String(e.message||e)+'</div>';document.getElementById('live').textContent='● OFFLINE'}}function render(){const h=DATA.historical||{},o=DATA.oos||{};const cards=(DATA.opportunities||[]).slice(0,10).map((x,i)=>`<div class="card" onclick="openTicker('${x.ticker}')"><div class="rank">${String(i+1).padStart(2,'0')}</div><div><div class="ctop"><b>${x.ticker}</b><span class="tag ${x.decision}">${x.decision}</span></div><h3>${x.company_name}</h3><p>${x.paradigm_name||'—'}</p></div><div class="score">${f(x.discovery_score)}</div><div class="mini"><span>INV ${f(x.investment_score,0)}</span><span>EXP ${f(x.exposure_score,0)}</span><span>MOM ${f(x.momentum_score,0)}</span></div></div>`).join('');const pars=(DATA.paradigms||[]).slice(0,7).map(x=>`<div class="par"><div><b>${x.name}</b><small>${f(x.mentions_7d,0)} mentions / 7j</small></div><strong>${f(x.oracle_score)}</strong><span>Accél. ${f(x.acceleration_score)} · Conv. ${f(x.convergence_score)}</span></div>`).join('');document.getElementById('app').innerHTML=`<div class="status"><div><b>${DATA.scientific_status}</b> · ${f(o.train_n,0)} train / ${f(o.test_n,0)} test</div><span>L’alpha hors échantillon n’est pas démontré. Les classements servent à prioriser la diligence.</span></div><div class="kpis"><div class="kpi"><small>DÉCISIONS MATURES</small><b>${f(h.mature_n,0)}</b></div><div class="kpi"><small>RENDEMENT 3M</small><b>${pct(h.avg_return_3m)}</b></div><div class="kpi"><small>ALPHA QQQ</small><b class="${h.avg_alpha_qqq<0?'neg':''}">${pct(h.avg_alpha_qqq)}</b></div><div class="kpi"><small>ALPHA SPY</small><b class="${h.avg_alpha_spy<0?'neg':''}">${pct(h.avg_alpha_spy)}</b></div><div class="kpi"><small>HIT RATE</small><b>${f(h.hit_rate_pct,1)}%</b></div><div class="kpi"><small>BAT QQQ</small><b>${f(h.beat_qqq_pct,1)}%</b></div></div><div class="layout"><section><div class="section-head"><h2>Opportunités prioritaires</h2><span>CLIQUER POUR ANALYSER →</span></div>${cards}</section><aside><h2>Paradigmes en accélération</h2>${pars}<div class="legend"><b>Lecture investisseur</b><p><span class="tag INVESTIGATE">INVESTIGATE</span> diligence prioritaire</p><p><span class="tag WATCH">WATCH</span> surveillance active</p><p><span class="tag DISCOVER">DISCOVER</span> piste émergente</p><p>ORACLE ne donne pas encore un signal d’achat validé. Il classe où concentrer le travail d’analyse.</p></div></aside></div>`}function openTicker(t){const x=(DATA.opportunities||[]).find(z=>z.ticker===t);if(!x)return;document.getElementById('detail').innerHTML=`<div class="ey">FICHE D’INVESTIGATION</div><h2>${x.ticker} · ${x.company_name}</h2><p class="note">${x.paradigm_name||'—'}</p><div class="big">${f(x.discovery_score)}</div><span class="tag ${x.decision}">${x.decision}</span><div class="grid2"><div class="box"><small>Investment score</small><b>${f(x.investment_score)}</b></div><div class="box"><small>Exposure</small><b>${f(x.exposure_score)}</b></div><div class="box"><small>Momentum</small><b>${f(x.momentum_score)}</b></div><div class="box"><small>Validation scientifique</small><b>${DATA.scientific_status}</b></div></div><div class="box" style="margin-top:10px"><b>Pourquoi maintenant ?</b><p class="note">ORACLE détecte une combinaison d’exposition au paradigme et de momentum suffisamment élevée pour mériter une analyse approfondie.</p></div><div class="box" style="margin-top:10px"><b>Avant toute décision</b><p class="note">Vérifier valorisation réelle, catalyseurs datés, risques spécifiques, scénario bull/base/bear et niveau d’invalidation de la thèse. Le classement n’est pas un conseil d’achat.</p></div>`;document.getElementById('drawer').classList.add('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}load();</script></body></html>
