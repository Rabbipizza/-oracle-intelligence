<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORACLE V6 · Cockpit Investisseur</title><style>
:root{--bg:#050907;--p:#0b1410;--p2:#101a15;--line:#263a31;--txt:#eef7f2;--muted:#8ca096;--g:#67e2a7;--a:#f0c66a;--r:#ff9292;--b:#8db8ff;--v:#c7a7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07110d,#030504 82%);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1700px;margin:auto;padding:14px 12px 60px}.top,.between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border:1px solid #3c735b;border-radius:50%;display:grid;place-items:center;color:var(--g);font-weight:950}.ey{font-size:9px;letter-spacing:.12em;color:#789084;font-weight:900}.muted{color:var(--muted);font-size:10px;line-height:1.45}.btn{display:inline-block;border:1px solid var(--line);padding:7px 9px;border-radius:8px;color:#dcebe4;text-decoration:none;font-size:9px;font-weight:850}.panel,.stage,.family{background:var(--p);border:1px solid var(--line);border-radius:14px}.section{margin-top:14px}.headline{font-size:clamp(28px,4vw,48px);font-weight:950;letter-spacing:-.045em;margin:5px 0}.green{color:var(--g)}.amber{color:var(--a)}.red{color:var(--r)}.blue{color:var(--b)}.violet{color:var(--v)}.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stage{padding:12px;min-height:150px}.stageNum{font-size:9px;font-weight:950;color:#748b80}.stageTitle{font-size:13px;font-weight:950;margin:3px 0 8px}.big{font-size:28px;font-weight:950;line-height:1}.tag{display:inline-block;border:1px solid #32463d;border-radius:99px;padding:3px 6px;font-size:8px;margin:2px;color:#c4d7cd}.tag.hot{border-color:#756531;color:var(--a)}.tag.good{border-color:#356e55;color:var(--g)}.tag.bad{border-color:#704545;color:var(--r)}.family{padding:13px;margin-top:9px}.familyHead{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:start}.familyName{font-size:18px;font-weight:950}.familySub{font-size:9px;color:var(--muted);margin-top:3px}.flow{display:grid;grid-template-columns:1.1fr 1.25fr 1.2fr 1.2fr 1fr;gap:7px}.cell{background:var(--p2);border:1px solid #1f3129;border-radius:11px;padding:9px;min-height:112px}.cellTitle{font-size:8px;letter-spacing:.08em;color:#768d82;font-weight:900;margin-bottom:5px}.primary{font-size:12px;font-weight:900;line-height:1.35}.small{font-size:9px;color:var(--muted);line-height:1.4}.row{padding:5px 0;border-bottom:1px solid #203029}.row:last-child{border:0}.score{font-size:23px;font-weight:950}.arrow{font-size:16px;font-weight:950}.early{font-size:22px;font-weight:950}.why{margin-top:5px;padding:6px 7px;background:#08120e;border-left:2px solid var(--b);font-size:9px;line-height:1.4}.warn{margin-top:5px;padding:6px 7px;background:#121008;border-left:2px solid var(--a);font-size:9px;line-height:1.4}.topline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.footer{margin-top:18px;color:#60736a;font-size:8px;line-height:1.45}@media(max-width:1100px){.stages{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr 1fr}.familyHead{grid-template-columns:1fr}}@media(max-width:650px){.top{display:block}.top>div:last-child{margin-top:8px}.stages,.flow{grid-template-columns:1fr}.headline{font-size:34px}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo">O</div><div><div class="ey">ORACLE V6 · INVESTISSEMENT LONG TERME</div><strong>Cockpit Investisseur</strong><div class="muted">Comprendre le résultat complet en un coup d’œil</div></div></div><div><a class="btn" href="./analytics.html">BACKTEST</a> <a class="btn" href="./control.html">CONTRÔLE</a></div></header><div id="app"><section class="panel section" style="padding:14px">Chargement…</section></div><footer class="footer">ORACLE distingue volontairement tendance, tension, solution, exposition et sous-valorisation. EARLY BIRD = candidat de recherche, pas recommandation d’achat.</footer></main><script>
const LIVE='https://ayjqeuljbznanmscpzlv.supabase.co/functions/v1/oracle-v6-cockpit-live';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const pct=v=>v==null?'—':`${(100*Number(v)).toFixed(1).replace('.',',')} %`;const num=v=>Number(v??0);const clean=s=>String(s||'').replace(/^Démographie · /,'').replace(/^TREND:/,'').replace(/^DEMOGRAPHY:/,'');
function familyOf(name){const n=clean(name).toLowerCase();if(/ai infrastructure|artificial intelligence|machine learning|deep learning|data center/.test(n))return 'AI / DATA CENTERS';if(/physical ai|robot learning|robotics/.test(n))return 'PHYSICAL AI / ROBOTICS';if(/^aging|fertility|working-age|population|urbanization|migration/.test(n))return 'DEMOGRAPHY';if(/energy storage|nuclear/.test(n))return 'ENERGY';if(/rare earth/.test(n))return 'RARE EARTHS';if(/health|medical|cancer|suicide|patient/.test(n))return 'HEALTH';if(/chip system|semiconductor/.test(n))return 'SEMICONDUCTORS';return clean(name).toUpperCase()}
function accelFor(name,d){const target=clean(name).toLowerCase();const s=(d.trend_acceleration?.structural||[]).find(x=>clean(x.trend).toLowerCase()===target);if(s)return {v:num(s.avg_acceleration),kind:'signal'};const m=(d.trend_acceleration?.demography||[]).find(x=>clean(x.trend).toLowerCase()===target);if(m)return {v:num(m.avg_acceleration),kind:'demo'};return {v:null,kind:'na'}}
function canonicalFamilies(d){const groups={};for(const c of d.chains||[]){const f=familyOf(c.trend);groups[f]??={name:f,chains:[],bottlenecks:[],picks:new Set(),suppliers:new Set(),materials:new Set(),scores:[]};const g=groups[f];g.chains.push(c);const a=accelFor(c.trend,d);if(a.v!=null&&Math.abs(a.v)<1000)g.scores.push(a.v);for(const b of c.bottlenecks||[]){g.bottlenecks.push(b);if(b.pick_and_shovel)g.picks.add(b.pick_and_shovel);for(const s of b.suppliers||[])g.suppliers.add(s);if(b.raw_material)g.materials.add(b.raw_material)}}return Object.values(groups).map(g=>{g.score=g.scores.length?Math.max(...g.scores):null;g.hot=[...new Map(g.bottlenecks.filter(x=>x.status==='EVIDENCE_BACKED_TENSION').map(x=>[x.name,x])).values()];g.struct=[...new Map(g.bottlenecks.map(x=>[x.name,x])).values()];g.picks=[...g.picks];g.suppliers=[...g.suppliers];g.materials=[...g.materials];return g}).sort((a,b)=>(b.hot.length-a.hot.length)||((b.score??-999)-(a.score??-999)))}
function candidateFor(g,d){const vals=d.valuation_candidates||[];const candidates=g.suppliers.map(t=>vals.find(v=>v.ticker===t)).filter(Boolean);return candidates.find(x=>x.underquoted_validated)||candidates.find(x=>x.capture_backed)||candidates[0]||null}
function stageBox(i,title,big,color,lines){return `<article class="stage"><div class="stageNum">ÉTAPE ${i}</div><div class="stageTitle">${esc(title)}</div><div class="big ${color}">${esc(big)}</div>${lines.map(x=>`<div class="row small">${x}</div>`).join('')}</article>`}
function familyCard(g,d){const best=candidateFor(g,d);const topB=g.hot.slice(0,4);const secondary=g.struct.filter(x=>!topB.some(h=>h.name===x.name)).slice(0,3);return `<article class="family"><div class="familyHead"><div><div class="ey">CHAÎNE D’INVESTISSEMENT</div><div class="familyName">${esc(g.name)}</div><div class="familySub">${g.chains.map(x=>esc(clean(x.trend))).slice(0,6).join(' · ')}</div></div><div class="topline"><span class="tag ${g.hot.length?'hot':''}">${g.hot.length} tension${g.hot.length>1?'s':''}</span><span class="tag">${g.struct.length} bottlenecks</span><span class="tag">${g.suppliers.length} sociétés</span>${g.materials.map(x=>`<span class="tag hot">${esc(x)}</span>`).join('')}</div></div><div class="flow" style="margin-top:10px"><div class="cell"><div class="cellTitle">1 · TREND</div><div class="score ${g.score!=null&&g.score>0?'green':'muted'}">${g.score==null?'—':g.score.toFixed(2)}</div><div class="small">${g.score==null?'Accélération non comparable / non disponible':'accélération observée'}</div><div class="why">${g.hot.length?'Le trend rencontre déjà au moins une contrainte corroborée.':'Trend structurel, pas encore de tension corroborée.'}</div></div><div class="cell"><div class="cellTitle">2 · BOTTLENECKS</div>${topB.length?topB.map(x=>`<div class="row"><span class="tag hot">${esc(x.name)}</span></div>`).join(''):'<div class="small">Aucune tension corroborée.</div>'}${secondary.length?`<div class="small" style="margin-top:5px">Autres dépendances : ${secondary.map(x=>esc(x.name)).join(' · ')}</div>`:''}</div><div class="cell"><div class="cellTitle">3 · PICKS & SHOVELS</div>${g.picks.length?g.picks.slice(0,5).map(x=>`<div class="row primary">${esc(x)}</div>`).join(''):'<div class="small">Solution encore à identifier.</div>'}</div><div class="cell"><div class="cellTitle">4 · SOCIÉTÉS / MATIÈRES</div><div>${g.suppliers.length?g.suppliers.map(t=>`<span class="tag">${esc(t)}</span>`).join(''):'<span class="small">Aucune société validée</span>'}</div>${g.materials.length?`<div class="small" style="margin-top:7px">Matières : ${g.materials.map(x=>esc(x)).join(' · ')}</div>`:''}</div><div class="cell"><div class="cellTitle">5 · EARLY BIRD</div>${best?`<div class="early">${esc(best.ticker)}</div><div class="${best.underquoted_validated?'green':'amber'}" style="font-size:9px;font-weight:950">${best.underquoted_validated?'SOUS-COTÉ VALIDÉ':'À ÉTUDIER'}</div><div class="small">Capture : ${best.capture_backed?'étayée':'à prouver'}${best.implied_fcf_cagr!=null?`<br>Marché exige : ${pct(best.implied_fcf_cagr)} FCF/an`:''}${best.forecast_fcf_cagr!=null?`<br>Forecast ORACLE : ${pct(best.forecast_fcf_cagr)}`:''}</div>`:'<div class="small">Pas encore de candidat.</div>'}</div></div></article>`}
function render(d){const fam=canonicalFamilies(d);const hot=fam.filter(x=>x.hot.length);const topTrends=[...fam].filter(x=>x.score!=null).sort((a,b)=>b.score-a.score).slice(0,4);const uniquePicks=[...new Set(fam.flatMap(x=>x.picks))].slice(0,5);const uniqueSup=[...new Set(fam.flatMap(x=>x.suppliers))];const mats=[...new Set(fam.flatMap(x=>x.materials))];const watch=d.watchlist||[];document.getElementById('app').innerHTML=`<section class="panel section" style="padding:14px"><div class="ey">RÉSUMÉ IMMÉDIAT</div><div class="headline">OÙ SONT LES OPPORTUNITÉS ?</div><div class="muted">Chaque bloc correspond exactement à une étape du raisonnement. Puis, en dessous, chaque famille de trend reprend la chaîne complète.</div></section><section class="stages section">${stageBox(1,'TRENDS QUI ACCÉLÈRENT',topTrends[0]?.name||'—','green',topTrends.slice(0,4).map(x=>`${esc(x.name)} · ${x.score.toFixed(2)}`))}${stageBox(2,'BOTTLENECKS RÉELS',`${d.structural_bottlenecks?.unique_tension_bottlenecks??0}`,'amber',hot.slice(0,4).map(x=>`${esc(x.name)} · ${x.hot.length} tension${x.hot.length>1?'s':''}`))}${stageBox(3,'PICKS & SHOVELS',`${uniquePicks.length}`,'blue',uniquePicks.map(x=>esc(x)))}${stageBox(4,'SOCIÉTÉS / MATIÈRES',`${uniqueSup.length}`,'violet',[`Sociétés : ${uniqueSup.slice(0,7).map(esc).join(' · ')||'—'}`,`Matières : ${mats.map(esc).join(' · ')||'—'}`])}${stageBox(5,'EARLY BIRD',watch[0]||'AUCUN','amber',[`Watchlist : ${watch.map(esc).join(' · ')||'aucune'}`,'0 BUY validé actuellement'])}</section><section class="section"><div class="between"><div><div class="ey">CHAÎNES COMPLÈTES</div><h2 style="margin:3px 0 0">Un trend = une ligne visuelle</h2></div><div class="small">Évaluation : ${esc(d.evaluation_as_of||'—')}</div></div>${fam.map(g=>familyCard(g,d)).join('')}</section>`}
fetch(LIVE+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.ok)throw 0;render(d)}).catch(()=>document.getElementById('app').innerHTML='<section class="panel section" style="padding:14px"><h2>Données live indisponibles</h2></section>');
</script></body></html>
