<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090d"><meta name="robots" content="noindex,nofollow"><title>ORACLE · Investor Dashboard</title>
<style>
:root{--bg:#07090d;--p:#0d121a;--line:#202938;--txt:#f5f7fb;--muted:#8d9bb0;--green:#69e4a3;--amber:#ffd166;--red:#ff8d8d;--blue:#83adff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#111a2a 0,#07090d 34%);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:26px 18px 64px}.ey{font-size:10px;letter-spacing:.2em;color:#66768d;font-weight:800}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin:9px 0 20px}.head h1{font-size:43px;letter-spacing:-.045em;line-height:1;margin:5px 0 7px}.head p{margin:0;color:var(--muted)}.live{font-size:10px;color:var(--green);text-align:right}.banner{border:1px solid #51451d;background:#18160e;border-radius:15px;padding:15px 17px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:13px}.banner strong{color:var(--amber)}.banner span{color:var(--muted);font-size:11px}.audit{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:21px}.audit .box,.kpi{background:rgba(13,18,26,.94);border:1px solid var(--line);border-radius:13px;padding:13px}.audit small,.kpi small{display:block;color:#718198;font-size:9px;margin-bottom:6px}.audit b{font-size:17px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:27px}.kpi b{font-size:21px}.neg{color:var(--red)}.pos{color:var(--green)}.layout{display:grid;grid-template-columns:1.55fr .78fr;gap:25px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.sectionHead h2,aside h2{font-size:16px}.sectionHead span{font-size:9px;color:#68788f;letter-spacing:.08em}.card{display:grid;grid-template-columns:35px 1fr 66px;gap:9px 12px;padding:16px 4px;border-top:1px solid var(--line);cursor:pointer}.card:hover{background:#0b1017}.rank{font-size:10px;color:#56657a}.topline{display:flex;align-items:center;gap:9px}.topline b{font-size:23px}.card h3{font-size:12px;color:#b6c1d0;font-weight:500;margin:3px 0}.card p{font-size:11px;color:#7c8da3;margin:0}.score{text-align:right;font-size:24px;color:var(--green);font-weight:800}.mini{grid-column:2/4;display:flex;gap:13px;font-size:9px;color:#65758b}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:8px;font-weight:800;letter-spacing:.05em}.INVESTIGATE{background:#103120;color:var(--green)}.WATCH{background:#362b0e;color:var(--amber)}.DISCOVER{background:#102744;color:var(--blue)}.LOW{background:#202631;color:#a0acba}.par{display:grid;grid-template-columns:1fr auto;gap:4px 9px;border-top:1px solid var(--line);padding:13px 0}.par small,.par span{color:#76859a;font-size:9px}.par span{grid-column:1/3}.par strong{color:var(--green)}.note{border:1px solid var(--line);border-radius:13px;background:var(--p);padding:14px;margin-top:20px;font-size:11px;color:var(--muted);line-height:1.55}.drawer{position:fixed;inset:0;background:rgba(2,5,9,.76);backdrop-filter:blur(8px);display:none;z-index:20}.drawer.open{display:block}.sheet{position:absolute;right:0;top:0;width:min(560px,100%);height:100%;overflow:auto;background:#090d13;border-left:1px solid var(--line);padding:24px}.close{float:right;border:0;border-radius:9px;background:#151b25;color:#d3dbe8;padding:8px 11px}.sheet h2{font-size:33px;margin:15px 0 6px}.big{font-size:42px;font-weight:800;color:var(--green)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.dBox{border:1px solid var(--line);border-radius:13px;background:var(--p);padding:14px}.dBox small{color:#718096}.dBox b{display:block;margin-top:5px}.err{border:1px solid #552832;background:#1d1015;color:#ffc0c0;border-radius:14px;padding:18px}@media(max-width:820px){.wrap{padding:20px 13px 55px}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:35px}.live{text-align:left}.banner{align-items:flex-start;flex-direction:column}.audit,.kpis{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="ey">ORACLE · INVESTOR DECISION SYSTEM · V1</div><div class="head"><div><h1>Où regarder maintenant ?</h1><p>Détection de paradigmes, priorisation d’entreprises et contrôle historique.</p></div><div class="live" id="live">● CONNEXION…</div></div><div id="app"></div></main><div class="drawer" id="drawer" onclick="if(event.target===this)closeD()"><div class="sheet"><button class="close" onclick="closeD()">×</button><div id="detail"></div></div></div>
<script>
const API='https://ayjqeuljbznanmscpzlv.supabase.co/functions/v1/oracle-investor-api';
const f=(x,d=1)=>x==null?'—':Number(x).toLocaleString('fr-CH',{maximumFractionDigits:d});
const pct=x=>x==null?'—':`${x>0?'+':''}${f(x,2)}%`;
let DATA;
async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('API '+r.status);DATA=await r.json();render();document.getElementById('live').innerHTML='● LIVE<br><span style="color:#718096">'+new Date(DATA.generated_at).toLocaleString('fr-CH')+'</span>'}catch(e){document.getElementById('app').innerHTML='<div class="err">Impossible de charger ORACLE : '+String(e.message||e)+'</div>';document.getElementById('live').textContent='● OFFLINE'}}
function render(){const h=DATA.historical||{},b=DATA.batch||{},o=DATA.oos||{};const cards=(DATA.opportunities||[]).slice(0,10).map((x,i)=>`<div class="card" onclick="openD('${x.ticker}')"><div class="rank">${String(i+1).padStart(2,'0')}</div><div><div class="topline"><b>${x.ticker}</b><span class="tag ${x.decision}">${x.decision}</span></div><h3>${x.company_name}</h3><p>${x.paradigm_name||'—'}</p></div><div class="score">${f(x.discovery_score)}</div><div class="mini"><span>INV ${f(x.investment_score,0)}</span><span>EXP ${f(x.exposure_score,0)}</span><span>MOM ${f(x.momentum_score,0)}</span></div></div>`).join('');const pars=(DATA.paradigms||[]).slice(0,7).map(x=>`<div class="par"><div><b>${x.name}</b><small>${f(x.mentions_7d,0)} mentions / 7j</small></div><strong>${f(x.oracle_score)}</strong><span>Accél. ${f(x.acceleration_score)} · Conv. ${f(x.convergence_score)}</span></div>`).join('');document.getElementById('app').innerHTML=`<div class="banner"><div><strong>${DATA.scientific_status||'UNKNOWN'}</strong> · ${DATA.validation_status||'—'}</div><span>ORACLE est utilisable pour prioriser la recherche, pas encore comme signal d’achat autonome : aucun alpha robuste hors échantillon n’est démontré.</span></div><div class="audit"><div class="box"><small>BATCH PROPRE</small><b>#${b.id||'—'}</b></div><div class="box"><small>IDENTITÉS VALIDÉES</small><b>${f(b.verified_picks,0)}</b></div><div class="box"><small>DÉCISIONS MATURES 3M</small><b>${f(h.mature_n,0)}</b></div><div class="box"><small>N EFFECTIF · COOLDOWN 90J</small><b>${f(h.effective_n_90d,0)}</b></div></div><div class="kpis"><div class="kpi"><small>RENDEMENT ORACLE 3M</small><b class="${h.avg_return_3m>=0?'pos':'neg'}">${pct(h.avg_return_3m)}</b></div><div class="kpi"><small>ALPHA QQQ</small><b class="${h.avg_alpha_qqq>=0?'pos':'neg'}">${pct(h.avg_alpha_qqq)}</b></div><div class="kpi"><small>ALPHA SPY</small><b class="${h.avg_alpha_spy>=0?'pos':'neg'}">${pct(h.avg_alpha_spy)}</b></div><div class="kpi"><small>POSITIONS POSITIVES</small><b>${f(h.hit_rate_pct,1)}%</b></div><div class="kpi"><small>BAT QQQ</small><b>${f(h.beat_qqq_pct,1)}%</b></div><div class="kpi"><small>OOS OFFICIEL</small><b>${o.status||'—'}</b></div></div><div class="layout"><section><div class="sectionHead"><h2>Opportunités prioritaires</h2><span>CLIQUER POUR ANALYSER →</span></div>${cards}</section><aside><h2>Paradigmes en accélération</h2>${pars}<div class="note"><b>Comment lire ORACLE</b><br><br><span class="tag INVESTIGATE">INVESTIGATE</span> diligence prioritaire<br><br><span class="tag WATCH">WATCH</span> surveillance active<br><br><span class="tag DISCOVER">DISCOVER</span> piste émergente<br><br>Les scores servent à décider <i>où chercher</i>, pas à déclencher automatiquement un achat.</div></aside></div>`}
function openD(t){const x=(DATA.opportunities||[]).find(z=>z.ticker===t);if(!x)return;document.getElementById('detail').innerHTML=`<div class="ey">FICHE D’INVESTIGATION</div><h2>${x.ticker} · ${x.company_name}</h2><p style="color:#8392a7">${x.paradigm_name||'—'}</p><div class="big">${f(x.discovery_score)}</div><span class="tag ${x.decision}">${x.decision}</span><div class="grid2"><div class="dBox"><small>Investment</small><b>${f(x.investment_score)}</b></div><div class="dBox"><small>Exposure</small><b>${f(x.exposure_score)}</b></div><div class="dBox"><small>Momentum</small><b>${f(x.momentum_score)}</b></div><div class="dBox"><small>Statut scientifique</small><b>${DATA.scientific_status}</b></div></div><div class="dBox" style="margin-top:10px"><b>Pourquoi maintenant ?</b><p style="color:#8392a7;line-height:1.55">ORACLE détecte une combinaison suffisamment élevée d’exposition au paradigme, de score d’investissement et de momentum pour justifier une diligence approfondie.</p></div><div class="dBox" style="margin-top:10px"><b>Avant toute décision</b><p style="color:#8392a7;line-height:1.55">Contrôler valorisation réelle, catalyseurs datés, risques, scénario bull/base/bear et niveau d’invalidation. Le score ORACLE n’est pas un conseil d’achat.</p></div>`;document.getElementById('drawer').classList.add('open')}
function closeD(){document.getElementById('drawer').classList.remove('open')}load();
</script></body></html>
