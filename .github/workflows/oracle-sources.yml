name: ORACLE Source Ingestion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'oracle_*.py'
      - 'source-gate.json'
      - 'sources-registry.json'
      - '.github/workflows/oracle-sources.yml'
  schedule:
    - cron: "15 7,15,21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: oracle-source-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and analyze upstream sources
        env:
          ORACLE_SEC_CIKS: "0001996810"
          ORACLE_USASPENDING_KEYWORDS: "counter-UAS,directed energy,tungsten,rare earth"
          ORACLE_ARXIV_QUERIES: "cat:cs.AI,cat:cs.RO,cat:cs.LG,cat:cs.CV"
          ORACLE_ARXIV_LOOKBACK_DAYS: "110"
          ORACLE_ARXIV_WINDOW_DAYS: "7"
          ORACLE_ARXIV_MAX_PER_WINDOW: "200"
        run: |
          python oracle_sources.py
          python oracle_science.py
          python oracle_scholarly.py
          python oracle_public_sources.py
          python oracle_discovery.py
          python oracle_source_gate.py
          python oracle_audit.py
      - name: Persist snapshots
        run: |
          git config user.name "oracle-bot"
          git config user.email "oracle-bot@users.noreply.github.com"
          git add data/source_snapshots data/source-gate-status.json data/discovery-candidates.json data/audit
          git diff --cached --quiet || git commit -m "ORACLE: source snapshots"
          # Serialized ingestion plus push-triggered Pages can advance main. Prefer generated run outputs on rebase conflicts.
          git pull --rebase -X theirs origin main
          git push
