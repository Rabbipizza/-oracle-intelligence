name: ORACLE Source Ingestion
on:
  workflow_dispatch:
  schedule:
    - cron: "15 7,15,21 * * 1-5"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and analyze upstream sources
        env:
          ORACLE_USER_AGENT: "ORACLE research pipeline"
          ORACLE_SEC_CIKS: "0001996810"
          ORACLE_USASPENDING_KEYWORDS: "counter-UAS,directed energy,tungsten,rare earth"
          ORACLE_ARXIV_QUERIES: "cat:cs.AI,cat:cs.RO,cat:cs.LG,cat:cs.CV"
        run: |
          python oracle_sources.py
          python oracle_science.py
          python oracle_discovery.py
          python oracle_source_gate.py
          python oracle_audit.py
      - name: Persist snapshots
        run: |
          git config user.name "oracle-bot"
          git config user.email "oracle-bot@users.noreply.github.com"
          git add data/source_snapshots data/source-gate-status.json data/discovery-candidates.json data/audit
          git diff --cached --quiet || git commit -m "ORACLE: source snapshots"
          git push
