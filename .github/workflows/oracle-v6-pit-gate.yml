name: ORACLE V6 PIT Gate

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'analytics/oracle_v6_pit_access.py'
      - 'tests/test_oracle_v6_pit_access.py'
      - 'sql/tests/p0_4_pit_gate.sql'
      - '.github/workflows/oracle-v6-pit-gate.yml'

permissions:
  contents: read

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_SUPABASE_DB_URL: ${{ secrets.ORACLE_SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --quiet pytest
      - name: Run PIT unit tests
        run: python -m pytest -q tests/test_oracle_v6_pit_access.py
      - name: Compile PIT gateway
        run: python -m py_compile analytics/oracle_v6_pit_access.py
      - name: Reject direct source access in V6 backtests
        shell: bash
        run: |
          set -euo pipefail
          files=$(find analytics -maxdepth 1 -type f -name 'oracle_v6_*backtest*.py' -print)
          if [ -n "$files" ]; then
            if grep -En 'oracle_raw_documents|oracle_structural_signals|oracle_v5_fundamental_snapshots|oracle_v5_monthly_prices|oracle_v2_daily_prices' $files; then
              echo 'P0-4 FAIL: V6 backtest directly references a source table' >&2
              exit 1
            fi
          fi
      - name: Validate database secret
        shell: bash
        run: |
          case "$ORACLE_SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo 'ORACLE_SUPABASE_DB_URL is not a PostgreSQL URL' >&2; exit 1 ;;
          esac
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run live PIT integration gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/p0_4_pit_gate.sql
