# ORACLE V6 autonomous scientific pipeline
name: ORACLE V6 Discovery FDR
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,11,17 * * *'
  push:
    branches: [ main ]
    paths:
      - 'analytics/oracle_v6_*.py'
      - 'requirements-v6.txt'
      - 'sql/v6_*.sql'
      - 'sql/p0_*.sql'
      - 'sql/tests/v6_*.sql'
      - 'sql/tests/p0_*.sql'
      - '.github/workflows/oracle-v6-discovery-fdr.yml'
concurrency:
  group: oracle-v6-discovery
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fdr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORACLE_SUPABASE_DB_URL: ${{ secrets.ORACLE_SUPABASE_DB_URL }}
      ORACLE_V6_FDR_ALPHA: '0.05'
    steps:
      - uses: actions/checkout@v4
      - name: Validate database secret
        shell: bash
        run: |
          case "$ORACLE_SUPABASE_DB_URL" in postgres://*|postgresql://*) ;; *) exit 1 ;; esac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v6.txt
      - name: Install dependencies
        run: pip install -r requirements-v6.txt
      - name: Compile scientific code
        run: python -m py_compile analytics/oracle_v6_scientific_core.py analytics/oracle_v6_formal_nulls.py analytics/oracle_v6_sequential_fdr.py analytics/oracle_v6_discovery_pipeline.py analytics/oracle_v6_trend_probability.py analytics/oracle_v6_signal_lifecycle.py analytics/oracle_v6_semantic_bridge.py analytics/oracle_v6_transmission_graph.py analytics/oracle_v6_evaluation_clock.py analytics/oracle_v6_demographic_context.py analytics/oracle_v6_demographic_trends.py analytics/oracle_v6_structural_bottlenecks.py analytics/oracle_v6_structural_company_bridge.py analytics/oracle_v6_bottleneck_tension.py analytics/oracle_v6_bottleneck_gate.py analytics/oracle_v6_sec_capture_trigger.py analytics/oracle_v6_sec_capture_backfill.py analytics/oracle_v6_economic_capture_evidence.py analytics/oracle_v6_capture_calibration_gate.py analytics/oracle_v6_company_capture_gate.py analytics/oracle_v6_sec_edge_trigger.py analytics/oracle_v6_sec_materialize.py analytics/oracle_v6_reverse_dcf.py analytics/oracle_v6_fundamental_forecast.py analytics/oracle_v6_market_expectations_gate.py analytics/oracle_v6_decision_gate.py analytics/oracle_v6_forward_validation.py analytics/oracle_v6_tension_benchmark.py analytics/oracle_v6_end_to_end_edge_audit.py
      - name: Formal rolling count nulls
        working-directory: analytics
        run: python oracle_v6_formal_nulls.py
      - name: Allocate sequential alpha budget
        working-directory: analytics
        run: python oracle_v6_sequential_fdr.py
      - name: Production BH-FDR
        working-directory: analytics
        run: python oracle_v6_discovery_pipeline.py
      - name: Persistence probabilities
        working-directory: analytics
        run: python oracle_v6_trend_probability.py
      - name: Temporal signal lifecycle
        working-directory: analytics
        run: python oracle_v6_signal_lifecycle.py
      - name: PIT semantic bridge
        working-directory: analytics
        run: python oracle_v6_semantic_bridge.py
      - name: Descriptive transmission graph
        working-directory: analytics
        run: python oracle_v6_transmission_graph.py
      - name: Freeze evaluation clock
        working-directory: analytics
        run: python oracle_v6_evaluation_clock.py
      - name: Demographic structural context
        working-directory: analytics
        run: python oracle_v6_demographic_context.py
      - name: Detect demographic trends
        working-directory: analytics
        run: python oracle_v6_demographic_trends.py
      - name: Anticipate structural bottlenecks
        working-directory: analytics
        run: python oracle_v6_structural_bottlenecks.py
      - name: Map structural bottlenecks to company evidence
        working-directory: analytics
        run: python oracle_v6_structural_company_bridge.py
      - name: Materialize evidence-backed bottleneck tension
        working-directory: analytics
        run: python oracle_v6_bottleneck_tension.py
      - name: P0-8 contextual tension benchmark
        working-directory: analytics
        run: python oracle_v6_tension_benchmark.py
      - name: Bottleneck calibration gate
        working-directory: analytics
        run: python oracle_v6_bottleneck_gate.py
      - name: SEC capture full-text via Supabase Edge
        working-directory: analytics
        run: python oracle_v6_sec_capture_trigger.py
      - name: Materialize PIT SEC capture evidence
        working-directory: analytics
        run: python oracle_v6_sec_capture_backfill.py
      - name: Economic capture evidence
        working-directory: analytics
        run: python oracle_v6_economic_capture_evidence.py
      - name: Economic capture calibration readiness
        working-directory: analytics
        run: python oracle_v6_capture_calibration_gate.py
      - name: Company capture evidence gate
        working-directory: analytics
        run: python oracle_v6_company_capture_gate.py
      - name: SEC financial ingestion via Supabase Edge
        working-directory: analytics
        run: python oracle_v6_sec_edge_trigger.py
      - name: Materialize SEC PIT FCF and position
        working-directory: analytics
        run: python oracle_v6_sec_materialize.py
      - name: Deterministic PIT reverse DCF
        working-directory: analytics
        run: python oracle_v6_reverse_dcf.py
      - name: Walk-forward fundamental forecast
        working-directory: analytics
        run: python oracle_v6_fundamental_forecast.py
      - name: Market expectations calibration gate
        working-directory: analytics
        run: python oracle_v6_market_expectations_gate.py
      - name: Final decision gate
        working-directory: analytics
        run: python oracle_v6_decision_gate.py
      - name: Record and mature forward validation
        working-directory: analytics
        run: python oracle_v6_forward_validation.py
      - name: End-to-end OOS edge audit
        working-directory: analytics
        run: python oracle_v6_end_to_end_edge_audit.py
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: FDR gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/p0_3_fdr_gate.sql
      - name: P0-6 Analyst Memory independence gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/p0_6_memory_link_independence.sql
      - name: P0-7 sequential multiple-testing gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/p0_7_sequential_fdr_gate.sql
      - name: P0-8 tension downstream safety gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/p0_8_tension_validation_safety.sql
      - name: Discovery PIT gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_discovery_pit_gate.sql
      - name: Immutable term vintage gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_term_history_vintage_gate.sql
      - name: Evaluation clock gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_evaluation_clock_gate.sql
      - name: Demographic context gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_demographic_context_gate.sql
      - name: Demographic trends gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_demographic_trends_gate.sql
      - name: Structural bottleneck gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_structural_bottleneck_gate.sql
      - name: Structural bottleneck company bridge gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_structural_company_bridge_gate.sql
      - name: Bottleneck tension evidence gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_bottleneck_tension_gate.sql
      - name: Economic capture evidence gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_economic_capture_evidence_gate.sql
      - name: Economic capture calibration gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_capture_calibration_gate.sql
      - name: Company capture gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_company_capture_gate.sql
      - name: SEC cashflow PIT gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_sec_cashflow_pit_gate.sql
      - name: SEC position PIT gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_sec_position_pit_gate.sql
      - name: Reverse DCF gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_reverse_dcf_gate.sql
      - name: Fundamental forecast calibration gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_fundamental_forecast_gate.sql
      - name: Market expectations gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_market_expectations_gate.sql
      - name: Final decision gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_decision_gate.sql
      - name: Forward validation safety gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_forward_validation_gate.sql
