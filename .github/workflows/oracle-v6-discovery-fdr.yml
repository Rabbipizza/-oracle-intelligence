# ORACLE V6: formal null -> BH-FDR -> persistence -> semantic bridge -> descriptive transmission
name: ORACLE V6 Discovery FDR

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,11,17 * * *'
  push:
    branches: [ main ]
    paths:
      - 'analytics/oracle_v6_formal_nulls.py'
      - 'analytics/oracle_v6_discovery_pipeline.py'
      - 'analytics/oracle_v6_trend_probability.py'
      - 'analytics/oracle_v6_semantic_bridge.py'
      - 'analytics/oracle_v6_transmission_graph.py'
      - 'analytics/oracle_v6_scientific_core.py'
      - 'requirements-v6.txt'
      - 'sql/p0_3_fdr_production_gate.sql'
      - 'sql/v6_term_history_vintage_guard.sql'
      - 'sql/tests/p0_3_fdr_gate.sql'
      - 'sql/tests/v6_discovery_pit_gate.sql'
      - 'sql/tests/v6_term_history_vintage_gate.sql'
      - '.github/workflows/oracle-v6-discovery-fdr.yml'

concurrency:
  group: oracle-v6-discovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fdr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORACLE_SUPABASE_DB_URL: ${{ secrets.ORACLE_SUPABASE_DB_URL }}
      ORACLE_V6_FDR_ALPHA: '0.05'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database secret
        shell: bash
        run: |
          case "$ORACLE_SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "ORACLE_SUPABASE_DB_URL is not a PostgreSQL URL" >&2; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v6.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-v6.txt

      - name: Compile V6 scientific code
        run: python -m py_compile analytics/oracle_v6_scientific_core.py analytics/oracle_v6_formal_nulls.py analytics/oracle_v6_discovery_pipeline.py analytics/oracle_v6_trend_probability.py analytics/oracle_v6_semantic_bridge.py analytics/oracle_v6_transmission_graph.py

      - name: Fit formal rolling count nulls
        working-directory: analytics
        run: python oracle_v6_formal_nulls.py

      - name: Run production Benjamini-Hochberg family
        working-directory: analytics
        run: python oracle_v6_discovery_pipeline.py

      - name: Estimate structural persistence probabilities
        working-directory: analytics
        run: python oracle_v6_trend_probability.py

      - name: Build PIT lexical-to-structural semantic bridge
        working-directory: analytics
        run: python oracle_v6_semantic_bridge.py

      - name: Build PIT descriptive transmission graph
        working-directory: analytics
        run: python oracle_v6_transmission_graph.py

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Run FDR gate integration test
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/p0_3_fdr_gate.sql

      - name: Run Discovery PIT timestamp gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_discovery_pit_gate.sql

      - name: Run immutable term-history vintage gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/v6_term_history_vintage_gate.sql
