name: ORACLE V6 P0-9 Full Historical Grid

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/oracle-v6-p0-9-full.yml'

permissions:
  contents: read

jobs:
  full-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORACLE_SUPABASE_DB_URL: ${{ secrets.ORACLE_SUPABASE_DB_URL }}
      ORACLE_V6_SIMULATED_DATES: '2018-12-31,2019-06-30,2019-12-31,2020-06-30,2020-12-31,2021-12-31,2022-03-31,2022-12-31,2023-06-30,2023-12-31'
      ORACLE_V6_RECONSTRUCTION_RUN: 'P0_9_FULL_GRID_2018_2023_V2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate database secret
        shell: bash
        run: |
          case "$ORACLE_SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo 'ORACLE_SUPABASE_DB_URL is not a PostgreSQL URL' >&2; exit 1 ;;
          esac
      - name: Install dependencies
        run: pip install -r requirements-v6.txt
      - name: Run full simulated-historical reconstruction
        working-directory: analytics
        run: python oracle_v6_simulated_historical_nulls.py | tee /tmp/p0_9_full.json
      - name: Verify complete grid
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/p0_9_full.json'))
          assert p.get('conditional_selection_guard') is True, p
          assert len(p['dates']) == 10, p
          for d in p['dates']:
              assert d['family_size'] > 0, d
              print(json.dumps(d,sort_keys=True))
          PY
