name: ORACLE V5 Analytics

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'analytics/oracle_v5_final_worker.py'
      - 'data/v5_ranked_picks/**'
      - 'data/v5_ranked_reserve/**'
      - 'data/v5_live_fallback.json'
      - '.github/workflows/oracle-v5-analytics.yml'
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: oracle-v5-analytics
  cancel-in-progress: true

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ORACLE V5 final PIT analytics worker
        run: python analytics/oracle_v5_final_worker.py
      - name: Commit analytics artifact when changed
        run: |
          git config user.name "oracle-v5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v5_analytics.json
          if git diff --cached --quiet; then
            echo "No analytics changes"
            exit 0
          fi
          git commit -m "Update ORACLE V5 final analytics artifact"
          git push
