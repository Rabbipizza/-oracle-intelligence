name: ORACLE V5 Live Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: oracle-v5-live-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh precomputed investor snapshot
        env:
          ORACLE_V5_API: https://ayjqeuljbznanmscpzlv.supabase.co/functions/v1/oracle-v5-investor-build
        run: python analytics/update_live_snapshot.py
      - name: Commit snapshot when changed
        env:
          ORACLE_V5_API: https://ayjqeuljbznanmscpzlv.supabase.co/functions/v1/oracle-v5-investor-build
        run: |
          git config user.name "oracle-v5-bot"
          git config user.email "actions@users.noreply.github.com"
          publish() {
            git add data/v5_live_fallback.json
            if git diff --cached --quiet; then
              echo "No snapshot change"
              return 0
            fi
            git commit -m "Refresh ORACLE V5 precomputed investor snapshot"
            git push origin main
          }
          if ! publish; then
            echo "Remote changed while snapshot was building; regenerate from latest main"
            git fetch origin main
            git reset --hard origin/main
            python analytics/update_live_snapshot.py
            publish
          fi
