name: ORACLE Macro Stress Fast Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macro-stress-fast.yml'

permissions:
  contents: read

jobs:
  macro-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Macro Stress Gap backtest
        run: python oracle_macro_stress.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: macro-stress-result
          path: data/macro-stress-backtest.json
          if-no-files-found: error
