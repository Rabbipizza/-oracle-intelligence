name: ORACLE daily observation
on:
  schedule:
    - cron: "17 05 * * *"
  workflow_dispatch:
  push:
    paths:
      - "oracle.py"
      - "oracle_access.py"
      - "sources/access_profiles.json"
      - "sources/registry.csv"
      - "oracle_billboard.py"
      - "oracle_pipeline.py"
      - "index.html"
      - "docs/ORACLE_7_ETAPES.md"
      - "tests/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: oracle-repo-writes
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Sample public sources
        run: python oracle.py
      - name: Save daily observation and billboard
        run: |
          git config user.name "oracle-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: daily ORACLE public-source sample"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
