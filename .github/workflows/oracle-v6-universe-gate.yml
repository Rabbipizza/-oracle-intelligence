name: ORACLE V6 Historical Universe Gate

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'sql/p0_5_historical_universe.sql'
      - 'sql/tests/p0_5_historical_universe_gate.sql'
      - '.github/workflows/oracle-v6-universe-gate.yml'

permissions:
  contents: read

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_SUPABASE_DB_URL: ${{ secrets.ORACLE_SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate database secret
        shell: bash
        run: |
          case "$ORACLE_SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo 'ORACLE_SUPABASE_DB_URL is not a PostgreSQL URL' >&2; exit 1 ;;
          esac
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run historical universe integration gate
        run: psql --set=ON_ERROR_STOP=1 --dbname="$ORACLE_SUPABASE_DB_URL" --file=sql/tests/p0_5_historical_universe_gate.sql
