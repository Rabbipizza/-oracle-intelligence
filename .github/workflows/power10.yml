name: ORACLE POWER 10 Prospective Run
on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * 1-5"
permissions:
  contents: write
concurrency:
  group: oracle-power10
  cancel-in-progress: true
jobs:
  power10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build prospective POWER 10 snapshot
        run: python power10.py
      - name: Persist immutable forward state
        run: |
          git config user.name "oracle-power10-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/power10.json
          git diff --cached --quiet || git commit -m "POWER10 prospective snapshot"
          git pull --rebase
          git push
