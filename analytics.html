<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ORACLE V5 · Analytics</title>
<style>
:root{--bg:#060a09;--p:#0b1210;--p2:#101a17;--line:#20302a;--txt:#eef7f2;--muted:#8ca099;--green:#62e6a7;--amber:#f5c76b;--red:#ff8f8f;--blue:#8db7ff}*{box-sizing:border-box}body{margin:0;background:#060a09;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(1200px,100%);margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border:1px solid #3a6a56;border-radius:50%;display:grid;place-items:center;color:var(--green);font-weight:900}.eyebrow{font-size:9px;letter-spacing:.14em;color:#789087;font-weight:850}.btn{border:1px solid var(--line);background:#101915;color:#dcebe4;padding:8px 10px;border-radius:8px;font-size:9px;font-weight:800;text-decoration:none}.panel{margin-top:14px;border:1px solid var(--line);background:var(--p);border-radius:14px;padding:16px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{border:1px solid var(--line);background:var(--p2);border-radius:10px;padding:13px}.metric b{font-size:25px;display:block;margin-top:5px}.muted{color:var(--muted);font-size:9px;line-height:1.5}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}table{width:100%;border-collapse:collapse;min-width:720px}th{font-size:8px;color:#71887e;text-align:left;padding:8px;border-bottom:1px solid var(--line)}td{font-size:10px;padding:9px 8px;border-bottom:1px solid #18241f}.wrap{overflow:auto}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:8px;font-weight:850;border:1px solid #39473f}.pill.VALIDATED{color:var(--green);border-color:#23563f}.pill.RESEARCH_ONLY{color:var(--amber);border-color:#59491f}.error{color:var(--red)}@media(max-width:750px){.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand"><div class="mark">O5</div><div><div class="eyebrow">ORACLE · EXTERNAL ANALYTICS</div><strong>Walk-Forward Laboratory</strong></div></div><a class="btn" href="./">← COCKPIT</a></header>
<div id="app"><section class="panel">Chargement du moteur analytique externe…</section></div>
</main>
<script>
const $=x=>document.getElementById(x),n=(v,d=1)=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toLocaleString('fr-CH',{maximumFractionDigits:d}),pct=v=>v==null?'—':n(v,1)+'%',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(d){const models=d.models||{},entries=Object.entries(models),valid=entries.filter(([,v])=>v.status==='VALIDATED').length,c=d.counts||{},rows=entries.map(([name,v])=>{const o=v.overall||{};return `<tr><td><b>${esc(name)}</b></td><td><span class="pill ${esc(v.status)}">${esc(v.status)}</span></td><td>${n(o.n,0)}</td><td>${pct(o.avg_alpha_6m)}</td><td>${pct(o.median_alpha_6m)}</td><td>${pct(o.win_rate_vs_qqq)}</td><td>${pct(o.trimmed_alpha_90pct)}</td></tr>`}).join('');$('app').innerHTML=`<section class="panel"><div class="eyebrow">MOTEUR ${esc(d.engine)}</div><h1>Validation hors Supabase</h1><p class="muted">Le calcul lourd et les cours du backtest sont traités hors de la base opérationnelle. Gate : N≥100, alpha médian positif, win-rate >55%, alpha trimmed positif et stabilité par régime.</p></section><section class="panel metrics"><div class="metric"><span class="eyebrow">FEATURES PIT</span><b>${n(c.features,0)}</b></div><div class="metric"><span class="eyebrow">TRIMESTRES</span><b>${n(c.feature_quarters,0)}</b></div><div class="metric"><span class="eyebrow">FACTEURS VALIDÉS</span><b class="${valid?'green':'amber'}">${valid}</b></div><div class="metric"><span class="eyebrow">PRIX CHARGÉS</span><b>${n(c.price_tickers_loaded,0)}</b><span class="muted">/${n(c.price_tickers_requested,0)}</span></div></section><section class="panel"><h2>Modèles walk-forward</h2><div class="wrap"><table><thead><tr><th>MODÈLE</th><th>STATUT</th><th>N</th><th>ALPHA MOY.</th><th>ALPHA MÉDIAN</th><th>WIN VS QQQ</th><th>TRIMMED</th></tr></thead><tbody>${rows}</tbody></table></div></section><section class="panel"><div class="eyebrow">MÉTHODOLOGIE</div><p class="muted">Benchmark ${esc(d.methodology?.benchmark)} · horizon ${n(d.methodology?.horizon_months,0)} mois · ${esc(d.methodology?.entry)} · ${esc(d.methodology?.exit)}.</p><p class="muted">Généré : ${esc(d.generated_at||'—')}</p></section>`}
async function load(){try{const r=await fetch('./data/v5_analytics.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Analytics externe pas encore généré (HTTP '+r.status+')');const d=await r.json();render(d)}catch(e){$('app').innerHTML=`<section class="panel error"><b>Analytics externe indisponible</b><p class="muted">${esc(e.message||e)}</p><p class="muted">Le moteur live principal reste accessible depuis le cockpit.</p></section>`}}load();
</script></body></html>
