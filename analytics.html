<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ORACLE V5 · Final Analytics</title><style>
:root{--bg:#060a09;--p:#0b1210;--p2:#101a17;--line:#20302a;--txt:#eef7f2;--muted:#8ca099;--green:#62e6a7;--amber:#f5c76b;--red:#ff8f8f;--blue:#8db7ff}*{box-sizing:border-box}body{margin:0;background:#060a09;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(1250px,100%);margin:auto;padding:22px 15px 60px}.top,.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border:1px solid #3a6a56;border-radius:50%;display:grid;place-items:center;color:var(--green);font-weight:900}.eyebrow{font-size:9px;letter-spacing:.13em;color:#789087;font-weight:850}.btn{border:1px solid var(--line);background:#101915;color:#dcebe4;padding:8px 10px;border-radius:8px;font-size:9px;font-weight:800;text-decoration:none}.panel{margin-top:13px;border:1px solid var(--line);background:var(--p);border-radius:14px;padding:16px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric,.card{border:1px solid var(--line);background:var(--p2);border-radius:10px;padding:12px}.metric b{font-size:24px;display:block;margin-top:4px}.muted{color:var(--muted);font-size:9px;line-height:1.5}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.blue{color:var(--blue)}table{width:100%;border-collapse:collapse;min-width:760px}th{font-size:8px;color:#71887e;text-align:left;padding:8px;border-bottom:1px solid var(--line)}td{font-size:10px;padding:9px 8px;border-bottom:1px solid #18241f}.wrap{overflow:auto}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:8px;font-weight:850;border:1px solid #39473f}.pill.VALIDATED{color:var(--green);border-color:#23563f}.pill.RESEARCH_ONLY{color:var(--amber);border-color:#59491f}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card h3{margin:5px 0}.big{font-size:28px;font-weight:900}.error{color:var(--red)}@media(max-width:800px){.metrics,.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.metrics,.cards{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="mark">O5</div><div><div class="eyebrow">ORACLE · FINAL VALIDATION</div><strong>External Point-in-Time Laboratory</strong></div></div><a class="btn" href="./">← COCKPIT</a></header><div id="app"><section class="panel">Chargement…</section></div></main><script>
const $=x=>document.getElementById(x),n=(v,d=1)=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toLocaleString('fr-CH',{maximumFractionDigits:d}),pct=v=>v==null?'—':n(v,1)+'%',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(d){const models=d.models||{},entries=Object.entries(models),valid=entries.filter(([,v])=>v.status==='VALIDATED').length,c=d.counts||{},ready=d.production_readiness||{},cur=d.current_decision||{},cands=cur.candidates||[];const rows=entries.map(([name,v])=>{const o=v.overall||{};return `<tr><td><b>${esc(name)}</b></td><td><span class="pill ${esc(v.status)}">${esc(v.status)}</span></td><td>${n(o.n,0)}</td><td>${pct(o.avg_alpha_6m)}</td><td>${pct(o.median_alpha_6m)}</td><td>${pct(o.win_rate_vs_qqq)}</td><td>${pct(o.trimmed_alpha_90pct)}</td></tr>`}).join('');const candHtml=cands.length?cands.map(x=>`<div class="card"><div class="eyebrow">${esc(x.status||'')}</div><h3>${esc(x.ticker)} · ${esc(x.company_name||'')}</h3><div class="big ${x.decision==='BUY_CANDIDATE'||x.decision==='PILOT_BUY'?'green':'amber'}">${esc(x.decision||'WATCH')}</div><div class="muted">Composite ${n(x.composite_score,1)} · Early ${n(x.early_bird_score,1)} · Fondamental ${n(x.fundamental?.score,1)} / qualité ${n(x.fundamental?.quality,0)} · Gap proxy ${n(x.expectation_gap?.score,1)}</div><div class="muted">Poids papier max ${pct(x.max_paper_weight_pct)}</div></div>`).join(''):'<div class="card"><div class="muted">Aucun candidat courant franchissant les couches disponibles.</div></div>';$('app').innerHTML=`<section class="panel"><div class="eyebrow">MOTEUR ${esc(d.engine)}</div><h1>Validation finale hors Supabase</h1><p class="muted">Prix et fondamentaux historiques sont traités hors de la base live. SEC Companyfacts est filtré par <b>filed ≤ date de décision</b>. L’expectation gap est un proxy de rerating marché, explicitement distinct d’un consensus analyste.</p></section><section class="panel metrics"><div class="metric"><span class="eyebrow">PICKS ÉLIGIBLES</span><b>${n(c.listing_eligible_picks,0)}</b><span class="muted">${n(c.listing_rejections,0)} rejetés par listing gate</span></div><div class="metric"><span class="eyebrow">SEC COMPANYFACTS</span><b>${n(c.sec_companyfacts_loaded,0)}</b><span class="muted">${n(c.sec_failures,0)} échecs</span></div><div class="metric"><span class="eyebrow">MODÈLES VALIDÉS</span><b class="${valid?'green':'amber'}">${valid}</b></div><div class="metric"><span class="eyebrow">ARGENT RÉEL</span><b class="${ready.real_money_alpha_validated?'green':'red'}">${ready.real_money_alpha_validated?'VALIDÉ':'BLOQUÉ'}</b></div></section><section class="panel"><h2>Décision actuelle · ${esc(cur.global||ready.global_decision||'NO_ACTION')}</h2><div class="cards">${candHtml}</div></section><section class="panel"><h2>Modèles walk-forward</h2><div class="wrap"><table><thead><tr><th>MODÈLE</th><th>STATUT</th><th>N</th><th>ALPHA MOY.</th><th>ALPHA MÉDIAN</th><th>WIN VS QQQ</th><th>TRIMMED</th></tr></thead><tbody>${rows}</tbody></table></div></section><section class="panel"><div class="eyebrow">READINESS</div><p class="muted">Produit recherche : <b>${ready.research_product_complete?'COMPLET':'INCOMPLET'}</b> · trading réel autonome : <b>${ready.real_money_autonomous_trading_enabled?'ACTIF':'DÉSACTIVÉ'}</b>.</p><p class="muted">Limitations déclarées : ${(ready.remaining_non_blocking_limitations||[]).map(esc).join(' · ')||'—'}</p><p class="muted">Généré : ${esc(d.generated_at||'—')}</p></section>`}
async function load(){try{const r=await fetch('./data/v5_analytics.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);render(await r.json())}catch(e){$('app').innerHTML=`<section class="panel error"><b>Analytics indisponible</b><p class="muted">${esc(e.message||e)}</p></section>`}}load();
</script></body></html>
